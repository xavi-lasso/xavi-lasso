                   draws downwards and wipes out on a loop until the page is
                   scrolled. It lives in the nav so script.js colours it like the
                   labels — white over a dark frame, ink over a pale one — and it
                   sits after the four corners so the intro, which places those,

            <!-- Case study thumbnails: one frame per project in projects/, each
                 opening its own case-*.html. The crop shown here is the curated
                 file from thumbs/ where there is one, and a frame lifted from
                 the project folder where there is not. Ratios and the pair /
                 full-width rhythm follow the sketch: 4:5 in pairs, 17:10 across
                 the full width. The case studies cut their frames to each
                 picture's own shape; this grid keeps the sketch's cadence. -->
            <div class="thumb-grid" id="works">

              <a class="thumb" href="case-boards-wood.html" aria-label="Boards + Wood">
                <img src="thumbs/01-surfangel.webp" alt="Boards + Wood: a fan of pale wooden blades twisting like a wing" loading="lazy">
              </a>

              <!-- autoplay needs muted AND playsinline: every browser blocks
                   sound-on autoplay, and without playsinline iOS takes the video
                   fullscreen the moment it starts. Where a clip has a webm
                   master it is listed first and an mp4 follows: VP9 holds more
                   picture per byte than H.264, so the webm is both the smaller
                   file and the better image, and the mp4 is there for iOS
                   before 17.4, which cannot play WebM at all.

                   thumbs/02-wood.mp4 is deliberately NOT the same file as the
                   one on the case study, and the two should not be collapsed
                   into one again. Here the clip plays in a frame about 700px
                   wide; there it opens full screen in the viewer, so that page
                   keeps the 13 MB master. This is the same footage at 4.7 Mbps,
                   which is indistinguishable from the master frame by frame and
                   saves seven and a half megabytes on the first page anyone
                   loads. -->
              <a class="thumb" href="case-boards-wood.html" aria-label="Boards + Wood">
                <video autoplay muted loop playsinline preload="metadata">
                  <source src="thumbs/02-wood.mp4" type="video/mp4">
                </video>
              </a>

              <!-- The project's own master rather than the crop in thumbs/,
                   which was a close-up of a face on a dark ground and needed
                   2.4 Mbps to keep skin from banding — 5.7 MB on the first page
                   anyone loads. This carries the same project at 2.5 MB.
                   webm first and mp4 after, as everywhere a webm master exists:
                   VP9 holds more picture per byte, and the mp4 is there for iOS
                   before 17.4, which cannot play WebM at all. -->
              <a class="thumb thumb--wide" href="case-rendition.html" aria-label="Rendition">
